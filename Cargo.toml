[package]
name = "timestrip"
version = "0.1.0"
edition = "2021"
description = "A customizable menu bar world clock for macOS"
license = "MIT"
publish = false

[dependencies]
# Menu bar item + menu, and the event loop that drives it
tray-icon = "0.26"
tao = "0.37"
# Settings window
eframe = "0.37"
# Time zones
chrono = "0.4"
chrono-tz = "0.10"
iana-time-zone = "0.1"
# Text rendering for the menu bar image (any installed font, any size)
fontdb = "0.24"
ab_glyph = "0.2.32"
# Config file
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "6"
# "Copy" menu items
arboard = "3"

[target.'cfg(target_os = "macos")'.dependencies]
objc2-core-foundation = { version = "0.3.2", default-features = false, features = ["std", "CFRunLoop"] }

[profile.release]
lto = "thin"
strip = true

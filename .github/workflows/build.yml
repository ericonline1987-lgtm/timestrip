name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  macos:
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin, x86_64-apple-darwin

      - uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build --all-targets --message-format=short 2>&1 | tee build.log; exit ${PIPESTATUS[0]}

      - name: Test
        run: cargo test 2>&1 | tee test.log; exit ${PIPESTATUS[0]}

      # Surface compiler/test output as annotations so it's readable without the raw logs.
      - name: Report errors
        if: failure()
        run: |
          for f in build.log test.log; do
            [ -f "$f" ] || continue
            body=$(grep -vE '^\s*(Compiling|Downloaded|Downloading|Checking|Fresh|Locking|Adding|Updating)\b' "$f" | tail -c 60000 | sed -e 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
            echo "::error title=$f::$body"
          done

      - name: Build TimeStrip.app (universal)
        run: scripts/bundle-macos.sh --universal

      - name: Zip
        run: ditto -c -k --keepParent target/bundle/TimeStrip.app TimeStrip-macos.zip

      - uses: actions/upload-artifact@v4
        with:
          name: TimeStrip-macos
          path: TimeStrip-macos.zip

      - name: Publish release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" TimeStrip-macos.zip --generate-notes
